# ============================================================================
# ReimburseAgent — Docker Compose 全栈部署
# ============================================================================
# 启动方式:
#   开发模式 (全部服务):  docker compose up -d
#   生产模式 (含 Nginx):   docker compose --profile production up -d
#   仅数据层:              docker compose up -d postgres redis minio
#   停止全部:              docker compose down
#   清理数据卷:            docker compose down -v
# ============================================================================

services:
  # ==========================================================================
  # 数据层 — PostgreSQL 16
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reimburse
      POSTGRES_PASSWORD: reimburse123
      POSTGRES_DB: reimburse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reimburse -d reimburse_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # 数据层 — Redis 7 (缓存 + Celery 消息队列)
  # ==========================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ==========================================================================
  # 数据层 — MinIO 对象存储 (票据文件/PDF)
  # ==========================================================================
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ==========================================================================
  # MinIO 存储桶初始化 (一次性任务)
  # ==========================================================================
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing local/reimburse-attachments;
      echo '✅ MinIO bucket ready';
      exit 0;
      "
    restart: "no"

  # ==========================================================================
  # 应用层 — FastAPI 后端 + LangGraph 智能体
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # 数据库
      DATABASE_URL: postgresql+asyncpg://reimburse:reimburse123@postgres:5432/reimburse_db
      DATABASE_URL_SYNC: postgresql://reimburse:reimburse123@postgres:5432/reimburse_db
      # Redis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      # MinIO
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: reimburse-attachments
      # LLM (从宿主机 .env 读取，无则用占位)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-xxx}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@company.com}
      # 其他
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]

  # ==========================================================================
  # 任务层 — Celery Worker (异步邮件/OCR/PDF)
  # ==========================================================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://reimburse:reimburse123@postgres:5432/reimburse_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-xxx}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    command: uv run celery -A app.core.celery_app worker --loglevel=info --concurrency=2

  # ==========================================================================
  # 前端 — React + Vite (开发模式)
  # ==========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    restart: unless-stopped

  # ==========================================================================
  # 反向代理 — Nginx (仅生产模式)
  # ==========================================================================
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    profiles:
      - production

# ============================================================================
# 命名数据卷
# ============================================================================
volumes:
  postgres_data:
  redis_data:
  minio_data:
  upload_data:
  frontend_node_modules:
