[project]
name = "reimburse-agent-backend"
version = "0.1.0"
description = "Enterprise Finance Reimbursement Assistant - Backend API & Agent Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "minio>=7.2.0",
    "aiosmtplib>=3.0.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.2.0",
    "loguru>=0.7.0",
    "pypdf>=6.14.2",
    # RAG 向量知识库
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    # 认证
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
]

[project.scripts]
reimburse = "app.cli:main"

# Windows 下 exe 容易被锁，改用模块调用: uv run python -m app.cli start
# [tool.uv]
# package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
