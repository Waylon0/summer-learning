[project]
name = "reimburse-agent-backend"
version = "0.1.0"
description = "Enterprise Finance Reimbursement Assistant - Backend API & Agent Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
    "minio>=7.2.0",
    "aiosmtplib>=3.0.0",
    "python-multipart>=0.0.9",
    "reportlab>=4.2.0",
    "loguru>=0.7.0",
    "pypdf>=6.14.2",
    # 认证：JWT 用标准库自实现（见 app/core/security.py），密码用 bcrypt
    "bcrypt>=4.0.0",
]

# 可选依赖：语义 RAG（ChromaDB + sentence-transformers，会引入体积很大的 torch）。
# 不安装时，政策检索自动降级为对 data/knowledge/*.md 的关键词检索，功能不受阻断。
# 需要语义向量检索时：uv sync --extra rag
[project.optional-dependencies]
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]
# OCR 增强（票据归一化 / PDF 渲染 / 增值税二维码解码）：
#   uv sync --extra ocr
ocr = [
    "numpy>=1.26.0",
    "pymupdf>=1.24.0",          # PDF 逐页渲染为高清图
    "opencv-python-headless>=4.9.0",  # 增值税发票二维码解码
]

[project.scripts]
reimburse = "app.cli:main"

# Windows 下 exe 容易被锁，改用模块调用: uv run python -m app.cli start
# [tool.uv]
# package = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
